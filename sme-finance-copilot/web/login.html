<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SME Finance Copilot</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/common.css"><link rel="stylesheet" href="/assets/auth.css"></head><body class="auth-page">
<header><div><h1>SME Finance Copilot</h1><p>Shenzhen International Fintechathon</p></div></header>
<main class="login"><div class="card"><h2 id="heading">Sign in</h2><p class="muted">Access your business workspace.</p>
<div id="message" role="alert" aria-live="polite"></div>
<form id="login"><label>Username or email<input id="username" autocomplete="username" required maxlength="150"></label><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><div class="auth-options"><label class="check"><input id="show" type="checkbox">Show password</label><a href="/reset-password">Forgot password?</a></div><button id="sign-in" type="submit">Sign in</button></form>
<form id="change" hidden><p>A new password is required before you can access business data.</p><label>Current temporary password<input id="current" type="password" autocomplete="current-password" required></label><label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" required></label><p class="muted">Use at least 12 characters with uppercase, lowercase and a number. Your administrator may require a longer password.</p><button>Change password</button></form>
</div></main>
<script>
const $=s=>document.querySelector(s);let csrf='';
function message(text,error=false){$('#message').textContent=text;$('#message').className='message'+(error?' error':'')}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw Error(result.error);return result}
function change(){ $('#login').hidden=true;$('#change').hidden=false;$('#heading').textContent='Change your password';$('#new-password').focus() }
$('#show').onchange=()=>$('#password').type=$('#show').checked?'text':'password';
$('#login').onsubmit=async e=>{e.preventDefault();$('#sign-in').disabled=true;try{const r=await post('/api/auth/login',{username:$('#username').value,password:$('#password').value});csrf=r.csrf_token;$('#current').value=$('#password').value;$('#password').value='';if(r.must_change_password)change();else location.href='/'}catch(e){message(e.message,true)}finally{$('#sign-in').disabled=false}};
$('#change').onsubmit=async e=>{e.preventDefault();try{if($('#new-password').value!==$('#confirm-password').value)throw Error('New passwords do not match');await post('/api/auth/change-password',{current_password:$('#current').value,new_password:$('#new-password').value});location.href='/login?changed=1'}catch(e){message(e.message,true)}};

(async()=>{const r=await fetch('/api/auth/me');if(r.ok){const me=await r.json();csrf=me.csrf_token;if(me.user.must_change_password)change();else location.href='/'}else if(location.search.includes('changed=1'))message('Password changed. Sign in again.');})()
</script></body></html>
