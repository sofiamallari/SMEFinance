<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Own-business User Management</title><link rel="stylesheet" href="/assets/common.css"><link rel="icon" href="data:,"></head><body><header><div><h1>Own-business User Management</h1><p id="who"></p></div><nav><a href="/">Business workspace</a><a href="/consents">Bank Authorization</a><button id="logout">Sign out</button></nav></header><main><div id="message" role="alert"></div><div class="card"><label>Authorized business<select id="merchant"></select></label></div><div class="card"><h2>Delegated Staff access</h2><p>Platform accounts and memberships are provisioned by System Admin. Only permissions for this business can be changed here.</p><div id="staff"></div></div><div class="card"><h2>Own-business access history</h2><div id="history"></div></div></main><script src="/assets/admin.js"></script><script>async function load(){const r=await api('/api/merchants');$('#merchant').replaceChildren(...r.map(m=>new Option(m.name,m.id)));if(!r.length){message('No authorized business available.',true);return}await refresh()}$('#merchant').onchange=()=>refresh().catch(e=>message(e.message,true));
async function refresh(){const mid=$('#merchant').value,r=await api('/api/owner/staff?merchant='+encodeURIComponent(mid));if(mid!==$('#merchant').value)return;$('#staff').innerHTML=r.staff.map(u=>'<form data-user="'+esc(u.user_id)+'" class="card"><h3>'+esc(u.display_name)+'</h3><p>'+esc(u.account_status)+'</p>'+r.permissions.map(action=>'<label class="check"><input type="checkbox" value="'+esc(action)+'" '+(u.permissions.includes(action)?'checked':'')+'>'+esc(action.replaceAll('_',' '))+'</label>').join('')+'<button>Save delegated access</button></form>').join('')||'No Staff accounts assigned. Ask System Admin to provision an account.';$('#staff').querySelectorAll('form').forEach(form=>form.onsubmit=async e=>{e.preventDefault();try{await api('/api/owner/staff',{merchant:mid,user_id:form.dataset.user,permissions:[...form.querySelectorAll('input:checked')].map(x=>x.value)},'PATCH');message('Permissions saved. Staff must sign in again.');await refresh()}catch(e){message(e.message,true)}});const history=await api('/api/merchant/audit?merchant='+encodeURIComponent(mid));$('#history').textContent=JSON.stringify(history.records,null,2);}
</script></body></html>
