<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank Financial Review</title><link rel="stylesheet" href="/assets/common.css"><link rel="icon" href="data:,"></head><body><header><div><h1>Bank Financial Review</h1><p id="who"></p></div><nav><button id="logout">Sign out</button></nav></header><main><div id="message" role="alert"></div><div class="card"><label>Authorized business<select id="merchant"></select></label></div><div class="card"><p>Read-only simulated review. No approval, rejection or real funds movement.</p><label>Routed submitted application<select id="application"><option value="">Merchant-level authorized review</option></select></label><button id="refresh">Refresh review</button><button id="export">Download CSV</button></div><div id="review"></div><div class="card"><h2>Read-only AI Financial Partner</h2><form id="ask"><label>Financial question<input id="question" required placeholder="Show my cash flow forecast"></label><button>Ask</button></form><pre id="answer" style="white-space:pre-wrap"></pre></div><div class="card"><h2>Your review audit events</h2><pre id="audit" style="white-space:pre-wrap"></pre></div></main><script src="/assets/admin.js"></script><script>async function load(){const r=await api('/api/merchants');$('#merchant').replaceChildren(...r.map(m=>new Option(m.name,m.id)));if(!r.length){message('No authorized business available.',true);return}await refresh()}$('#merchant').onchange=()=>refresh().catch(e=>message(e.message,true));
function params(){return '?merchant='+encodeURIComponent($('#merchant').value)+($('#application').value?'&application_id='+encodeURIComponent($('#application').value):'')}
function table(value){if(!value)return '<p>Unavailable</p>';const rows=Array.isArray(value)?value.map((v,i)=>[String(i+1),v]):Object.entries(value);return '<div style="overflow:auto"><table><thead><tr><th>Indicator</th><th>Existing evidence</th></tr></thead><tbody>'+rows.map(([key,v])=>'<tr><th>'+esc(key.replaceAll('_',' '))+'</th><td style="overflow-wrap:anywhere;white-space:pre-wrap">'+esc(typeof v==='object'?JSON.stringify(v,null,2):v)+'</td></tr>').join('')+'</tbody></table></div>'}
function chart(rows,key,label){if(!rows?.length)return '';const vals=rows.map(r=>Number(r[key])).filter(Number.isFinite);if(vals.length!==rows.length)return '';const min=Math.min(0,...vals),max=Math.max(...vals),span=max-min||1;const points=vals.map((v,i)=>(20+i*560/Math.max(1,vals.length-1))+','+(160-(v-min)*140/span)).join(' ');return '<figure><figcaption>'+esc(label)+'</figcaption><svg viewBox="0 0 600 180" role="img" aria-label="'+esc(label)+'" style="width:100%;max-width:700px"><polyline points="'+points+'" fill="none" stroke="#007d8b" stroke-width="3"/></svg></figure>'}
async function refresh(){const mid=$('#merchant').value;$('#export').disabled=true;$('#review').textContent='Loading authorized review…';try{const r=await api('/api/bank/review'+params());if(mid!==$('#merchant').value)return;const chosen=$('#application').value;$('#application').replaceChildren(new Option('Merchant-level authorized review',''),...r.applications.map(a=>new Option(a.application_id+' · '+a.status,a.application_id)));$('#application').value=chosen;const metrics=r.sections.recorded_metrics,forecast=r.sections.forecast;const cards=(metrics?'<div class="card"><h3>Recorded net sales</h3><b>'+esc(metrics.net_sales)+' '+esc(r.currency)+'</b></div><div class="card"><h3>Recorded expenses</h3><b>'+esc(metrics.expenses)+' '+esc(r.currency)+'</b></div><div class="card"><h3>Completed transactions</h3><b>'+esc(metrics.completed_transactions)+'</b></div>':'')+(forecast?'<div class="card"><h3>Estimated minimum balance</h3><b>'+esc(forecast.min_balance)+' '+esc(r.currency)+'</b></div>':'');$('#review').innerHTML='<div class="grid">'+cards+'</div><div class="card"><h2>'+esc(r.merchant_name)+'</h2><p>'+esc(r.disclaimer)+'</p><p>Business-data date: '+esc(r.as_of)+' · Currency: '+esc(r.currency)+'</p>'+table(r.application)+'</div>'+Object.entries(r.sections).map(([key,value])=>'<div class="card"><h2>'+esc(key.replaceAll('_',' '))+(key==='forecast'?' — ESTIMATED':'')+'</h2>'+ (key==='forecast'?chart(value.path,'balance','Estimated future balance'):key==='trends'?chart(value,'revenue','Recorded revenue trend'):'')+table(value)+'</div>').join('')+'<div class="card"><h2>Missing evidence</h2>'+r.missing.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';$('#export').disabled=false;const audit=await api('/api/merchant/audit?merchant='+encodeURIComponent(mid));$('#audit').textContent=JSON.stringify(audit.records,null,2)}catch(e){$('#review').textContent='Review unavailable: '+e.message;throw e}}
$('#refresh').onclick=()=>refresh().catch(e=>message(e.message,true));$('#application').onchange=$('#refresh').onclick;
$('#export').onclick=async()=>{try{const r=await fetch('/api/bank/export'+params());if(!r.ok)throw Error((await r.json()).error);const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='simulated-bank-review.csv';a.click();URL.revokeObjectURL(url);message('Authorized simulated CSV exported.')}catch(e){message(e.message,true)}};
$('#ask').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/chat',{merchant:$('#merchant').value,message:$('#question').value});$('#answer').textContent=r.reply+'\nMode: '+(r.connection_status||r.mode)}catch(e){message(e.message,true)}};
</script></body></html>
